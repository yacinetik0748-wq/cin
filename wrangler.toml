name = "recap-studio-ai"
pages_build_output_dir = "dist"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# OPTIONAL Cloudflare D1 database binding (not required — app works with local IndexedDB storage by default):
# [[d1_databases]]
# binding = "DB"
# database_name = "recap-studio-db"
# database_id = "<YOUR_D1_DATABASE_ID>"

# OPTIONAL Cloudflare R2 Bucket (Free Tier: 10 GB/month, requires Cloudflare R2 onboarding)
# Uncomment below if you enable R2. Without R2, media is stored in browser IndexedDB.
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "recap-studio-media"

[vars]
MAX_UPLOAD_SIZE_MB = "1500"
TEMP_RETENTION_HOURS = "24"
